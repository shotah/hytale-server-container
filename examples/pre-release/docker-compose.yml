# Pre-Release Hytale Server
#
# Run the latest pre-release version of Hytale server.
# Great for testing new features before they go live.
#
# Auto-restart keeps the server in sync with client updates.
# The container restarts every 6 hours, checks for a new version,
# and only re-downloads if one is available.

services:
  hytale:
    image: shotah/hytale-server:alpine
    container_name: hytale-server-pre-release
    environment:
      SERVER_IP: "0.0.0.0"
      SERVER_PORT: "5520"
      TZ: "UTC"
      DEBUG: "TRUE"
      
      # Use pre-release server version
      HYTALE_PATCHLINE: "pre-release"
      
      # Auto-restart to keep up with frequent pre-release updates
      ENABLE_AUTO_RESTART: "TRUE"
      AUTO_RESTART_INTERVAL: "6"   # Check every 6 hours
      
      HYTALE_SERVER_NAME: "Pre-Release Test Server"
      HYTALE_MOTD: "Testing the latest features!"
      
    restart: unless-stopped  # Required for auto-restart to work
    ports:
      - "5520:5520/udp"
    volumes:
      - ./data:/home/container
      - /etc/machine-id:/etc/machine-id:ro
    tty: true
    stdin_open: true
