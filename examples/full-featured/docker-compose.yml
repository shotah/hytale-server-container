# Full-Featured Hytale Server
#
# Demonstrates all available environment variables and features.
# Customize as needed for your server.

services:
  hytale:
    image: shotah/hytale-server:alpine
    container_name: hytale-server-full
    environment:
      # ===================
      # Server Binding
      # ===================
      SERVER_IP: "0.0.0.0"
      SERVER_PORT: "5520"
      TZ: "America/New_York"
      
      # ===================
      # Debug & Production
      # ===================
      DEBUG: "FALSE"      # Enable verbose logging
      PROD: "FALSE"       # Enable production checks
      
      # ===================
      # Memory & JVM Performance
      # ===================
      INIT_MEMORY: "4G"       # Initial heap size (-Xms)
      MAX_MEMORY: "8G"        # Maximum heap size (-Xmx)
      USE_G1GC: "TRUE"        # Hytale-recommended G1GC settings
      # USE_AIKAR_FLAGS: "TRUE"  # Aggressive GC (experimental, from Minecraft)
      HYTALE_CACHE: "TRUE"    # AOT cache for faster startup
      # JAVA_ARGS: ""         # Additional JVM args (advanced)
      
      # ===================
      # Server Configuration (config.json)
      # ===================
      HYTALE_SERVER_NAME: "My Awesome Server"
      HYTALE_MOTD: "Welcome! Have fun!"
      HYTALE_PASSWORD: ""           # Leave empty for public server
      HYTALE_MAX_PLAYERS: "100"
      HYTALE_MAX_VIEW_RADIUS: "32"
      HYTALE_COMPRESSION: "false"
      HYTALE_WORLD: "default"
      HYTALE_GAMEMODE: "Adventure"  # Adventure, Creative, etc.
      
      # ===================
      # Access Control
      # ===================
      HYTALE_WHITELIST_ENABLED: "false"
      # HYTALE_WHITELIST: "uuid1,uuid2,uuid3"  # Comma-separated UUIDs
      # HYTALE_OPS: "admin-uuid-here"          # Comma-separated UUIDs
      
      # ===================
      # Patchline (Server Version)
      # ===================
      HYTALE_PATCHLINE: "release"   # "release" or "pre-release"
      
      # ===================
      # CurseForge Mods
      # ===================
      # CURSEFORGE_MOD_IDS: "1423494,1430352"  # Comma-separated mod IDs
      
      # ===================
      # World Settings (per-world config)
      # Note: World must exist first (run server once)
      # ===================
      # HYTALE_PVP_ENABLED: "true"        # Enable PVP combat
      # HYTALE_FALL_DAMAGE: "true"        # Enable fall damage
      # HYTALE_NPC_SPAWNING: "true"       # Enable NPC/mob spawning
      # HYTALE_WORLD_GAMEMODE: "Adventure" # World-specific game mode
      # HYTALE_DAYTIME_DURATION: "1728"   # Day length in seconds
      # HYTALE_NIGHTTIME_DURATION: "1151" # Night length in seconds
      # HYTALE_TIME_PAUSED: "false"       # Freeze day/night cycle
      
    restart: unless-stopped
    ports:
      - "5520:5520/udp"
    volumes:
      - ./data:/home/container
      - /etc/machine-id:/etc/machine-id:ro
    tty: true
    stdin_open: true
