# Hytale Server with CurseForge Mods
#
# Automatically downloads mods from CurseForge on startup.
# No API key required!
#
# Setup:
#   1. Find mod IDs from https://www.curseforge.com/hytale
#   2. Add them to CURSEFORGE_MOD_IDS below
#   3. Run: docker-compose up

services:
  hytale:
    image: shotah/hytale-server:alpine
    container_name: hytale-server-mods
    environment:
      SERVER_IP: "0.0.0.0"
      SERVER_PORT: "5520"
      TZ: "UTC"
      DEBUG: "TRUE"  # See mod download logs
      
      # CurseForge mod IDs (comma-separated)
      # Find IDs in the URL: curseforge.com/hytale/mods/mod-name/12345
      CURSEFORGE_MOD_IDS: "1423494,1430352"
      
    restart: unless-stopped
    ports:
      - "5520:5520/udp"
    volumes:
      - ./data:/home/container
      - /etc/machine-id:/etc/machine-id:ro
    tty: true
    stdin_open: true
